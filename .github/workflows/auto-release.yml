name: Auto release
# Auto-increments the version and publishes a release each time a PR is merged
# into main. Version bump is label-driven: a PR labelled "Feature" bumps the
# minor, anything else (e.g. "Fix") bumps the patch. First release seeds at 0.1.0.
#
# Everything happens in ONE job with GITHUB_TOKEN (no PAT): compute version ->
# build in the shared MSDK image -> create tag + release. (A tag created here by
# GITHUB_TOKEN intentionally does NOT re-trigger deploy.yml, so there is no
# double release. deploy.yml remains for manual/ad-hoc semver tags.)
on:
  pull_request:
    types: [closed]

jobs:
  auto-release:
    name: auto-release
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/vamshi-smartrotamac/max78000-toolchain:v2024_10
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      IS_FEATURE: ${{ contains(github.event.pull_request.labels.*.name, 'Feature') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}   # the merged main
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next version (label-driven)
        id: ver
        run: |
          git config --global --add safe.directory "$PWD"
          latest=$(git tag -l | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$latest" ]; then
            next="0.1.0"
          else
            IFS=. read -r MA MI PA <<< "$latest"
            if [ "$IS_FEATURE" = "true" ]; then
              next="$MA.$((MI + 1)).0"   # Feature -> minor bump
            else
              next="$MA.$MI.$((PA + 1))" # Fix/other -> patch bump
            fi
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Next version: $next (previous='${latest:-none}', feature=$IS_FEATURE)"

      - name: Build release
        run: |
          make release BOARD=FTHR_RevA
          arm-none-eabi-objcopy build/max78000.elf -O binary build/max78000.bin

      - name: Create tag + release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.event.pull_request.base.ref }}
          name: ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            build/max78000.elf
            build/max78000.bin
            build/max78000.hex
