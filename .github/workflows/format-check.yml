name: Format Check
on:
  pull_request:

jobs:
  clang-format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # NOTE: non-blocking for now. The existing src/ and include/ code has a
      # large backlog of style violations against the team .clang-format, so
      # this check REPORTS violations (see the step logs/annotations) but does
      # not fail the PR. Once the backlog is cleared in a dedicated formatting
      # PR (or narrowed to changed files only), remove `continue-on-error`
      # below to make the check mandatory.
      - name: clang-format check (src/ and include/ only)
        continue-on-error: true
        uses: jidicula/clang-format-action@v4.10.2
        with:
          clang-format-version: "15"
          check-path: "."
          include-regex: '^\./(src|include)/.*\.(c|cc|cpp|h|hpp)$'
          exclude-regex: '(build|firmware-library-processing|tensorflow-lite-microcontrollers)/'
