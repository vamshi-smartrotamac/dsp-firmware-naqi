name: Deploy release
on:
  push:
    tags:
      # semver tags without a leading 'v' (matches the org pattern / devkit-firmware).
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  deploy:
    name: release
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: write
      pull-requests: read
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/vamshi-smartrotamac/max78000-toolchain:v2024_10
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Build release
        run: |
          make release BOARD=FTHR_RevA
          arm-none-eabi-objcopy build/max78000.elf -O binary build/max78000.bin
      - name: Publish GitHub release and changelog
        uses: vamshi-smartrotamac/max78000-ci-workflows/.github/actions/create-github-release@main
        with:
          # Single-line brace glob: the shared create-github-release action's
          # resolve-files step only handles a single-line files value (a plain
          # echo to GITHUB_OUTPUT breaks on multi-line). This one glob matches
          # all three artifacts.
          files: build/max78000.{elf,bin,hex}
          github_token: ${{ secrets.GITHUB_TOKEN }}
