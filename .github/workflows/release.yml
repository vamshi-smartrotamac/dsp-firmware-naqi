name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build toolchain image
        run: docker build -t dsp-firmware-sm-toolchain -f docker/max78000/Dockerfile .
      - name: make release + produce .bin
        run: |
          docker run --rm -v "$PWD":/work -w /work dsp-firmware-sm-toolchain bash -c \
            "make release BOARD=FTHR_RevA && arm-none-eabi-objcopy build/max78000.elf -O binary build/max78000.bin"
      - name: Create GitHub Release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/max78000.elf
            build/max78000.bin
            build/max78000.hex
